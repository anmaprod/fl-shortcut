# Page de téléchargement (site/) publiée sur GitHub Pages : https://<propriétaire>.github.io/<dépôt>/
# Les boutons pointent vers releases/latest/download/… : la page n'a pas besoin d'être republiée à chaque version.
# À activer une fois : Settings › Pages › Source : « GitHub Actions ».
# Actions épinglées par SHA de commit (relevés le 11 octobre 2026), comme build.yml.
name: Page de téléchargement

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
