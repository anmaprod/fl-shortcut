# Compilation, tests et publication de FL Shortcuts.
# Audit : SEC-09 / SUP-xx — actions épinglées par SHA de commit (le tag n'est qu'un commentaire),
# jeton en lecture seule par défaut, écriture limitée au job de publication, identifiants git non conservés,
# empreinte SHA-256 et attestation de provenance publiées avec le .dmg.
# Les SHA ci-dessous ont été relevés le 8 octobre 2026 ; Dependabot (dependabot.yml) les tient à jour.
name: FL Shortcuts

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mac_runner:
        description: "Mac de compilation (macos-26 par défaut ; un autre quand GitHub manque de Mac arm64)"
        type: choice
        default: macos-26
        options: [macos-26, macos-15-intel, macos-15]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-fl:
    name: Script FL (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests du script FL
        run: python3 -m unittest discover -s Tests/python -v

  communaute-sql:
    name: Serveur de la Communauté (règles d'accès)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: supabase/schema.sql et ses règles sur un vrai PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
          supabase/tests/run.sh -h /var/run/postgresql

  windows-core:
    name: Cœur Windows (tests .NET)
    # Version Windows reprise le 25/10 (demande du propriétaire) : compilée et essayée à chaque envoi.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests du cœur Windows
        run: dotnet test windows/FLShortcut.Core.Tests -c Release

  windows:
    name: App Windows (compilation)
    runs-on: windows-2025
    needs: [script-fl, windows-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilation x64 et ARM64
        shell: pwsh
        run: |
          $targets = @{ 'x64' = 'x64'; 'arm64' = 'ARM64' }
          foreach ($arch in $targets.Keys) {
            dotnet publish windows/FLShortcut.App -c Release -r "win-$arch" "-p:Platform=$($targets[$arch])" -o "dist/win-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/FLShortcuts-win-x64.zip
          Compress-Archive -Path dist/win-arm64/* -DestinationPath dist/FLShortcuts-win-arm64.zip
      - name: Installeur (un seul fichier, x64 + ARM64, sans droits administrateur)
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.0.0' }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $candidate)) {
              choco install innosetup --no-progress -y
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $iscc = $candidate
          } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=$version" "/DDistDir=$PWD\dist" windows/installer/FLShortcut.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/FLShortcuts-Windows-Setup.exe, dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist/FLShortcuts-win.sha256
      - name: Photos de l'Organiser (mode photos, sons d'exemple, rien n'est envoyé à FL)
        continue-on-error: true      # photos à relire : n'empêchent jamais la publication
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/photos-windows | Out-Null
          # Sous le débogueur de Windows (cdb, livré avec le kit de Windows) s'il est là : si WinUI tombe, il dit
          # l'erreur d'origine (HRESULT, message envoyé au débogueur) et la pile, au lieu du seul 0xC000027B.
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe", "$env:ProgramFiles\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cdb) {
            "débogueur : $($cdb.FullName)"
            $env:_NT_SYMBOL_PATH = "srv*$env:RUNNER_TEMP\symboles*https://msdl.microsoft.com/download/symbols"
            $journal = "$env:RUNNER_TEMP\cdb.txt"
            $app = Start-Process -FilePath $cdb.FullName -PassThru -NoNewWindow -RedirectStandardOutput $journal -ArgumentList `
              '-lines', '-c', '"g; .echo ==== ARRET ====; !analyze -v; .ecxr; kc 40; ~*kc 12; q"', "$PWD\dist\win-x64\FLShortcut.exe", '--photos', "$PWD\dist\photos-windows"
            if (-not $app.WaitForExit(300000)) { $app.Kill(); Write-Output "::warning::mode photos arrêté au bout de 5 min" }
            # Le débogueur parle beaucoup (modules chargés) : ce qui compte, les messages et l'analyse de l'arrêt.
            Get-Content $journal | Where-Object { $_ -notmatch '^ModLoad:' } | Select-Object -Last 400
          } else {
            "débogueur absent : lancement simple"
            $app = Start-Process -FilePath dist/win-x64/FLShortcut.exe -ArgumentList '--photos', "$PWD\dist\photos-windows" -PassThru
            if (-not $app.WaitForExit(120000)) { $app.Kill(); Write-Output "::warning::mode photos arrêté au bout de 2 min" }
            "code de sortie : $($app.ExitCode)"
          }
          Get-ChildItem dist/photos-windows | ForEach-Object { "$($_.Name)  $($_.Length) octets" }
          Get-Content dist/photos-windows/photos-journal.txt -ErrorAction SilentlyContinue
          "fichiers .pri : $((Get-ChildItem dist/win-x64 -Filter *.pri | ForEach-Object Name) -join ', ')"
          # L'appli est tombée : ce que Windows a noté (exception .NET avec sa pile, module fautif).
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error' } -MaxEvents 4 -ErrorAction SilentlyContinue |
            ForEach-Object { "---- $($_.ProviderName) $($_.TimeCreated)"; $_.Message }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLShortcuts-windows-photos
          path: dist/photos-windows
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLShortcuts-windows
          path: |
            dist/FLShortcuts-Windows-Setup.exe
            dist/FLShortcuts-win-*.zip
            dist/FLShortcuts-win.sha256
          if-no-files-found: error

  mac:
    name: App Mac (compilation + tests)
    # SDK macOS 26 (Xcode 26+) : sans lui, l'app garde l'ancien aspect, sans aucun Liquid Glass système
    # (barre latérale, barre d'outils, feuilles, boutons, panneau de la barre des menus).
    # Lancement à la main : un autre Mac possible (GitHub manque parfois de Mac arm64 : « not acquired by Runner »).
    runs-on: ${{ inputs.mac_runner || 'macos-26' }}
    needs: script-fl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode le plus récent
        run: |
          latest=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$latest" ]]; then sudo xcode-select -s "$latest"; fi
          swift --version && xcodebuild -version
      - name: Tests Swift
        run: swift test
      - name: Compilation universelle et .dmg
        env:
          # Facultatif : sans ces secrets, le build est signé « ad hoc » (test uniquement).
          SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          # Facultatif : serveur de la Communauté (supabase/README.md) ; sans eux, la page dit « pas encore ouverte ».
          FLS_SUPABASE_URL: ${{ secrets.FLS_SUPABASE_URL }}
          FLS_SUPABASE_ANON_KEY: ${{ secrets.FLS_SUPABASE_ANON_KEY }}
          # Facultatif : adresse de l'équipe pour la page Aide (variable du dépôt, publique : elle est dans l'app).
          FLS_SUPPORT_EMAIL: ${{ vars.FLS_SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CERT_P12:-}" ]]; then
            KC="$RUNNER_TEMP/signing.keychain-db"
            KC_PW="$(uuidgen)"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC"
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          else
            unset SIGN_IDENTITY
          fi
          if [[ -n "${NOTARY_KEY_P8:-}" ]]; then
            echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            export FLS_VERSION="${BASH_REMATCH[1]}"
          fi
          chmod +x build.sh
          ./build.sh
      - name: Textes en anglais (textes de l'app comparés à en.lproj)
        id: anglais
        # Un texte sans anglais rend la CI rouge à la fin du job (un Mac réglé dans une autre langue que le français
        # le verrait en français) ; les essais et le .dmg passent quand même.
        continue-on-error: true
        run: |
          set -o pipefail
          scripts/cles-traduction.sh dist/mesure --strict | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mesure de l'interface (mémoire et processeur, avec et sans verre)
        continue-on-error: true      # mesure indicative : n'empêche jamais la publication
        run: |
          {
            echo "## Mesure de l'interface (macOS 26)"
            scripts/mesure-interface.sh "dist/FL Shortcuts.app" dist/mesure
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Captures en anglais (app réglée sur l'anglais)
        continue-on-error: true      # captures à relire : n'empêchent jamais la publication
        run: scripts/captures-anglais.sh "dist/FL Shortcuts.app" dist/mesure/anglais
      - name: Essai du choix automatique du preset (vraie boîte « Open » de macOS)
        continue-on-error: true      # dépend de l'autorisation d'envoi d'événements du runner
        run: |
          mkdir -p dist/mesure
          OUT="$PWD/dist/mesure/selftest-preset.txt"
          pkill -x FLShortcut 2>/dev/null || true
          # Lancé depuis le shell (qui a l'autorisation d'envoyer des événements sur le runner) ; l'essai passe
          # lui-même au premier plan.
          "dist/FL Shortcuts.app/Contents/MacOS/FLShortcut" --selftest-preset "$OUT" &
          pid=$!
          ( for i in $(seq -w 1 16); do screencapture -x "dist/mesure/selftest-preset-$i.png" 2>/dev/null; sleep 0.4; done ) &
          # Chien de garde arrêté dès la fin de l'essai : sinon il survit à l'étape et tue l'essai suivant.
          ( sleep 60; kill "$pid" 2>/dev/null ) &
          dog=$!
          status=0; wait "$pid" || status=$?
          kill "$dog" 2>/dev/null || true
          { echo "## Essai du preset automatique"; echo '```'; cat dist/mesure/selftest-preset.txt; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Eq '^(PASS|SKIP)' dist/mesure/selftest-preset.txt && exit 0
          exit "${status:-1}"
      - name: Essai de la macro complète sur un FL simulé (menu de piste, boîte « Open », armement, REC, entrée)
        continue-on-error: true      # indicatif tant que le FL simulé est jeune ; le résultat est dans le résumé
        run: |
          mkdir -p dist/mesure
          BIN="dist/FL Shortcuts.app/Contents/MacOS/FLShortcut"
          STATE="$RUNNER_TEMP/fakefl.json"
          OUT="$PWD/dist/mesure/selftest-macro.txt"
          OUT2="$PWD/dist/mesure/selftest-macro-blocs.txt"
          OUT3="$PWD/dist/mesure/selftest-macro-clics.txt"
          OUT4="$PWD/dist/mesure/selftest-macro-touches.txt"
          pkill -x FLShortcut 2>/dev/null || true
          "$BIN" --fake-fl "$STATE" &
          fake=$!
          sleep 3
          # 1. Modèle « Enregistrement rapide » : 4 passages (inchangé).
          "$BIN" --selftest-macro "$OUT" "$STATE" "$fake" &
          drv=$!
          ( for i in $(seq -w 1 40); do screencapture -x "dist/mesure/selftest-macro-$i.png" 2>/dev/null; sleep 1; done ) &
          ( sleep 150; kill "$drv" 2>/dev/null ) &
          dog=$!
          status=0; wait "$drv" || status=$?
          kill "$dog" 2>/dev/null || true
          # 2. Macro construite en blocs, lancée par le même chemin que « Tester » dans le créateur.
          "$BIN" --selftest-macro "$OUT2" "$STATE" "$fake" --scenario blocs &
          drv2=$!
          ( for i in $(seq -w 1 8); do screencapture -x "dist/mesure/selftest-blocs-$i.png" 2>/dev/null; sleep 0.7; done ) &
          ( sleep 60; kill "$drv2" 2>/dev/null ) &
          dog=$!
          status2=0; wait "$drv2" || status2=$?
          kill "$dog" 2>/dev/null || true
          # 3. « Enregistrer des clics » : l'utilisateur simulé clique (menus, fenêtre des réglages), puis rejeu.
          "$BIN" --selftest-macro "$OUT3" "$STATE" "$fake" --scenario clics &
          drv3=$!
          ( for i in $(seq -w 1 12); do screencapture -x "dist/mesure/selftest-clics-$i.png" 2>/dev/null; sleep 1; done ) &
          ( sleep 120; kill "$drv3" 2>/dev/null ) &
          dog=$!
          status3=0; wait "$drv3" || status3=$?
          kill "$dog" 2>/dev/null || true
          # 4. « Enregistrer clics et touches » au clavier : ↓ et Entrée dans les menus de FL, ⌘S, R, puis rejeu.
          "$BIN" --selftest-macro "$OUT4" "$STATE" "$fake" --scenario touches &
          drv4=$!
          ( for i in $(seq -w 1 12); do screencapture -x "dist/mesure/selftest-touches-$i.png" 2>/dev/null; sleep 1; done ) &
          ( sleep 90; kill "$drv4" 2>/dev/null ) &
          dog=$!
          status4=0; wait "$drv4" || status4=$?
          kill "$dog" 2>/dev/null || true
          kill "$fake" 2>/dev/null || true
          { echo "## Essai de la macro sur le FL simulé"; echo '```'; cat "$OUT"; echo '```'
            echo "## Essai d'une macro construite en blocs (chemin du bouton « Tester »)"; echo '```'; cat "$OUT2"; echo '```'
            echo "## Essai « Enregistrer des clics » (enregistrement puis rejeu)"; echo '```'; cat "$OUT3"; echo '```'
            echo "## Essai « Enregistrer clics et touches » au clavier (enregistrement puis rejeu)"; echo '```'; cat "$OUT4"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -Eq '^(PASS|SKIP)' "$OUT" && grep -Eq '^(PASS|SKIP)' "$OUT2" && grep -Eq '^(PASS|SKIP)' "$OUT3" \
            && grep -Eq '^(PASS|SKIP)' "$OUT4" && exit 0
          [[ "$status" != 0 ]] && exit "$status"
          [[ "$status2" != 0 ]] && exit "$status2"
          [[ "$status3" != 0 ]] && exit "$status3"
          exit "${status4:-1}"
      - name: Essai de la désinstallation (.pkg installé, ancien nom, traces semées, plus rien ne doit rester ; sans puis avec la fenêtre)
        timeout-minutes: 14
        run: |
          status=0
          scripts/essai-desinstallation.sh dist dist/mesure/desinstallation.txt || status=$?
          status2=0
          scripts/essai-desinstallation.sh dist dist/mesure/desinstallation-fenetre.txt fenetre || status2=$?
          { echo "## Essai de la désinstallation"; echo '```'; cat dist/mesure/desinstallation.txt; echo '```'
            echo "## Essai de la vraie fenêtre de désinstallation"; echo '```'; cat dist/mesure/desinstallation-fenetre.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$status" != 0 ]] && exit "$status"
          exit "$status2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLShortcuts-mac
          path: |
            dist/FLShortcuts.dmg
            dist/FLShortcuts.dmg.sha256
            dist/FLShortcuts.pkg
            dist/FLShortcuts.pkg.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: FLShortcuts-mac-mesure
          path: dist/mesure
          if-no-files-found: ignore
      - name: Textes sans anglais (voir « Textes en anglais » dans le résumé)
        if: steps.anglais.outcome == 'failure'
        run: |
          echo "::error::Des textes de l'app n'ont pas de traduction anglaise : scripts/localisation.py generer"
          exit 1

  release:
    name: Publication (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # créer la release
      actions: read          # récupérer les artefacts des jobs « mac » et « windows »
      id-token: write        # attestation de provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Récupérer le .dmg et l'installeur Windows (outil officiel gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FLShortcuts-mac --dir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FLShortcuts-windows --dir dist
      - name: Vérifier les empreintes
        run: cd dist && sha256sum -c FLShortcuts.dmg.sha256 FLShortcuts.pkg.sha256 FLShortcuts-win.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/FLShortcuts.dmg
            dist/FLShortcuts.pkg
            dist/FLShortcuts-Windows-Setup.exe
            dist/FLShortcuts-win-*.zip
      - name: Créer la release (outil officiel gh, sans action tierce)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Noms de fichiers fixes : les liens « releases/latest/download/… » de la page de téléchargement
          # et du README pointent toujours vers la dernière version.
          gh release create "$TAG" dist/FLShortcuts.dmg dist/FLShortcuts.dmg.sha256 dist/FLShortcuts.pkg dist/FLShortcuts.pkg.sha256 \
            dist/FLShortcuts-Windows-Setup.exe dist/FLShortcuts-win-x64.zip dist/FLShortcuts-win-arm64.zip \
            dist/FLShortcuts-win.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "FL Shortcuts $TAG" \
            --notes-file .github/release-notes.md --generate-notes --verify-tag
