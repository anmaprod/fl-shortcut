# Compilation, tests et publication de FL Shortcut.
# Audit : SEC-09 / SUP-xx — actions épinglées par SHA de commit (le tag n'est qu'un commentaire),
# jeton en lecture seule par défaut, écriture limitée au job de publication, identifiants git non conservés,
# empreinte SHA-256 et attestation de provenance publiées avec le .dmg.
# Les SHA ci-dessous ont été relevés le 8 octobre 2026 ; Dependabot (dependabot.yml) les tient à jour.
name: FL Shortcut

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-fl:
    name: Script FL (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests du script FL
        run: python3 -m unittest discover -s Tests/python -v

  windows-core:
    name: Cœur Windows (tests .NET)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests du cœur Windows
        run: dotnet test windows/FLShortcut.Core.Tests -c Release

  windows:
    name: App Windows (compilation)
    runs-on: windows-2025
    needs: [script-fl, windows-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilation x64 et ARM64
        shell: pwsh
        run: |
          $targets = @{ 'x64' = 'x64'; 'arm64' = 'ARM64' }
          foreach ($arch in $targets.Keys) {
            dotnet publish windows/FLShortcut.App -c Release -r "win-$arch" "-p:Platform=$($targets[$arch])" -o "dist/win-$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/FLShortcut-win-x64.zip
          Compress-Archive -Path dist/win-arm64/* -DestinationPath dist/FLShortcut-win-arm64.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File -Encoding ascii dist/FLShortcut-win.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLShortcut-windows
          path: |
            dist/FLShortcut-win-*.zip
            dist/FLShortcut-win.sha256
          if-no-files-found: error

  mac:
    name: App Mac (compilation + tests)
    runs-on: macos-15
    needs: script-fl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions
        run: swift --version && xcodebuild -version
      - name: Tests Swift
        run: swift test
      - name: Compilation universelle et .dmg
        env:
          # Facultatif : sans ces secrets, le build est signé « ad hoc » (test uniquement).
          SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CERT_P12:-}" ]]; then
            KC="$RUNNER_TEMP/signing.keychain-db"
            KC_PW="$(uuidgen)"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            rm -f "$RUNNER_TEMP/cert.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC"
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          else
            unset SIGN_IDENTITY
          fi
          if [[ -n "${NOTARY_KEY_P8:-}" ]]; then
            echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          chmod +x build.sh
          ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FLShortcut-mac
          path: |
            dist/FLShortcut.dmg
            dist/FLShortcut.dmg.sha256
          if-no-files-found: error

  release:
    name: Publication (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # créer la release
      actions: read          # récupérer l'artefact du job « mac »
      id-token: write        # attestation de provenance
      attestations: write
    steps:
      - name: Récupérer le .dmg (outil officiel gh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name FLShortcut-mac --dir dist
      - name: Vérifier l'empreinte
        run: cd dist && sha256sum -c FLShortcut.dmg.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/FLShortcut.dmg
      - name: Créer la release (outil officiel gh, sans action tierce)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/FLShortcut.dmg dist/FLShortcut.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "FL Shortcut $TAG" --generate-notes --verify-tag
