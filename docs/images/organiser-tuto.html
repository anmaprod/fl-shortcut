<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tuto de l'Organiser</title>
<style>
/* Images du tuto de l'Organiser (Resources/*.lproj/OrganiserTuto1-4.png), rendues par rendre-organiser-tuto.js :
   organiser-tuto.html#fr-1 … #en-4. Style suisse de l'app (validé le 01/11) : fond noir, texte blanc, traits fins,
   coins carrés, libellés en petites capitales espacées, boutons rectangulaires en capitales (principal blanc plein),
   rouge seulement pour ce qu'on montre. 400 × 225 points, rendues à 2×. */
:root {
  --text: #FFFFFF; --muted: #8A8A8A; --soft: #A8A8A8; --line: #333333; --faint: #222222; --red: #FF3B1F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { font: 12px/1.35 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
.scene { width: 400px; height: 225px; overflow: hidden; position: relative; background: #000; border: 1px solid var(--line); }
.plate { background: #000; border: 1px solid var(--line); }
.sq { width: 8px; height: 8px; flex: none; }
.sq svg { display: none; }
.row { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px; font-size: 11px; }
.row + .row { border-top: 1px solid var(--faint); }
.blue, .grey { display: inline-flex; align-items: center; height: 24px; padding: 0 12px; font-weight: 700; font-size: 9px;
  letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; border: 1px solid #fff; }
.blue { background: #fff; color: #000; }
.grey { background: #000; color: #fff; }
.pulse { outline: 2px solid var(--red); outline-offset: 2px; }
.cursor { position: absolute; width: 18px; height: 18px; }
.label { font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
[data-step] { display: none; }

/* 1 : le projet ouvert dans FL, puis Organiser… dans le menu de l'icône */
.fl { position: absolute; left: 14px; top: 34px; width: 250px; height: 172px; background: #2B3034;
  border: 1px solid var(--line); overflow: hidden; }
.fl .bar { height: 20px; background: #1F2326; display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 9.5px; color: var(--soft); }
.fl .bar i { width: 7px; height: 7px; border-radius: 4px; background: #FF5F57; }
.fl .bar i:nth-child(2) { background: #FEBC2E; } .fl .bar i:nth-child(3) { background: #28C840; }
.fl .bar b { margin-left: 6px; color: var(--text); font-weight: 700; }
.lane { display: flex; align-items: center; height: 24px; border-bottom: 1px solid rgba(0,0,0,0.25); padding-left: 52px; position: relative; }
.lane span { position: absolute; left: 6px; font-size: 8.5px; color: rgba(255,255,255,0.55); }
.clip { height: 17px; margin-right: 4px; opacity: .92; flex: none; }
.menubar { position: absolute; top: 0; left: 0; right: 0; height: 22px; background: #000; border-bottom: 1px solid var(--line);
  display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 12px; font-size: 10px; color: var(--soft); }
.mbicon { width: 22px; height: 16px; display: grid; place-items: center; background: #fff; }
.mbicon svg { stroke: #000; }
.menu { position: absolute; right: 12px; top: 26px; width: 168px; background: #000; border: 1px solid var(--line);
  box-shadow: 0 16px 40px rgba(0,0,0,0.6); padding: 4px 0; }
.menu .it { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; font-size: 11px; white-space: nowrap; }
.menu .it + .it { border-top: 1px solid var(--faint); }
.menu .it.on { background: #fff; color: #000; }

/* 2 : l'écoute */
.listen { position: absolute; left: 24px; right: 24px; top: 26px; padding: 14px 14px 12px; border-left: 3px solid var(--text); }
.lhead { display: flex; align-items: flex-end; gap: 10px; }
.wave { display: none; }
.ltext { flex: 1; }
.ltext b { display: block; font-size: 15px; letter-spacing: -0.3px; margin: 3px 0 8px; }
.track { height: 2px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 50%; background: var(--text); }
.pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.sounds { display: flex; flex-wrap: wrap; gap: 0; margin-top: 12px; border-top: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; font-size: 10.5px;
  border-right: 1px solid var(--faint); border-bottom: 1px solid var(--faint); }
.chip.done::before { content: "✓"; font-weight: 700; }
.chip.now { background: #fff; color: #000; font-weight: 700; }
.chip.wait { color: var(--muted); }
.hands { position: absolute; left: 24px; bottom: 16px; font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--red); }

/* 3 : l'aperçu */
.fams { position: absolute; left: 16px; right: 16px; top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fams > div { min-width: 0; }
.fhead { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 8.5px; letter-spacing: 1.2px;
  text-transform: uppercase; margin: 0 0 4px 2px; }
.dot { width: 8px; height: 8px; flex: none; }
.fhead small { margin-left: auto; margin-right: 2px; color: var(--muted); font-weight: 700; font-size: 8px; }
.fams .plate { border-top-width: 3px; }
.old { color: var(--soft); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.to { color: var(--muted); }
.new { font-weight: 700; }
.slot { min-width: 22px; height: 16px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff;
  padding: 0 3px; flex: none; border: 1px solid; background: #000 !important; }
.foot { position: absolute; right: 16px; bottom: 14px; display: flex; gap: 0; }

/* 4 : la copie rangée */
.files { position: absolute; left: 20px; right: 20px; top: 20px; display: flex; align-items: center; justify-content: space-between; }
.file { width: 150px; height: 112px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.doc { width: 30px; height: 38px; background: #fff; position: relative; }
.doc::after { content: "FLP"; position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; font-size: 8px; font-weight: 800; color: #000; }
.doc.copy { background: #000; border: 1px solid #fff; }
.doc.copy::after { color: #fff; }
.file b { font-size: 12px; }
.file small { color: var(--muted); font-size: 7.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; }
.arrow2 { color: var(--red); font-size: 22px; font-weight: 700; }
.ask { position: absolute; left: 20px; right: 20px; bottom: 14px; display: flex; align-items: center; gap: 0; padding: 8px 8px 8px 12px;
  border-top: 1px solid #fff; }
.ask span:first-child { flex: 1; min-width: 0; font-weight: 700; font-size: 11px; line-height: 1.2; padding-right: 8px; }
.ask .blue, .ask .grey { padding: 0 9px; font-size: 8px; letter-spacing: 0.8px; }
</style>
</head>
<body>
<div class="scene">

  <div data-step="1">
    <div class="menubar"><span class="mbicon"><svg width="12" height="9" viewBox="0 0 16 12" fill="none" stroke="#F5F5F7" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="14" height="10" rx="2"/><path d="M4 4.5h1M7.5 4.5h1M11 4.5h1M4.5 8h7"/></svg></span><span data-t="date"></span></div>
    <div class="fl">
      <div class="bar"><i></i><i></i><i></i><b data-t="projet"></b></div>
      <div class="lane"><span>Kick</span><div class="clip" style="width:46px;background:#E2574C"></div><div class="clip" style="width:46px;background:#E2574C"></div><div class="clip" style="width:46px;background:#E2574C"></div></div>
      <div class="lane"><span>Snare</span><div class="clip" style="width:46px;background:#E8913A;margin-left:24px"></div><div class="clip" style="width:70px;background:#E8913A"></div></div>
      <div class="lane"><span>808</span><div class="clip" style="width:96px;background:#D9B23D"></div><div class="clip" style="width:46px;background:#D9B23D"></div></div>
      <div class="lane"><span>Pad</span><div class="clip" style="width:150px;background:#9A6AE0"></div></div>
      <div class="lane"><span>Vocal</span><div class="clip" style="width:60px;background:#4FA3E0;margin-left:48px"></div></div>
      <div class="lane"><span>FX</span><div class="clip" style="width:22px;background:#43B581;margin-left:100px"></div></div>
    </div>
    <div class="menu">
      <div class="it"><span class="sq" style="background:#0A84FF"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4h13v8h-13zM4.5 9.5h7"/></svg></span><span data-t="raccourcis"></span></div>
      <div class="it"><span class="sq" style="background:#BF5AF2"><svg viewBox="0 0 16 16" fill="#fff"><path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z"/></svg></span><span data-t="macros"></span></div>
      <div class="it on pulse"><span class="sq" style="background:#5E5CE6"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><path d="M8 2l6 3-6 3-6-3zM2 8l6 3 6-3M2 11l6 3 6-3"/></svg></span><b data-t="organiser"></b></div>
    </div>
    <svg class="cursor" style="right:40px;top:96px" viewBox="0 0 24 24"><path d="M5 3l14 9-6.5 1.4L16 21l-3 1.4-3.5-7.7L5 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>

  <div data-step="2">
    <div class="plate listen">
      <div class="lhead">
        <div class="wave"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#C9C8FF" stroke-width="1.6" stroke-linecap="round"><path d="M2 8h1M4.5 5v6M7 3v10M9.5 6v4M12 4.5v7"/></svg></div>
        <div class="ltext"><span class="label" data-t="organiserLabel"></span><b data-t="ecoute"></b><div class="track"><i></i></div></div>
        <span class="pct">50 %</span>
      </div>
      <div class="sounds">
        <span class="chip done">Kick</span><span class="chip done">Snare</span><span class="chip done">Hi-hat</span>
        <span class="chip now">♪ 808</span><span class="chip wait">Pad</span><span class="chip wait">Lead</span><span class="chip wait">Vocal</span><span class="chip wait">FX</span>
      </div>
    </div>
    <div class="hands" data-t="mains"></div>
  </div>

  <div data-step="3">
    <div class="fams">
      <div>
        <div class="fhead"><span class="dot" style="background:#FF453A"></span>Drums<small>Mixer 2</small></div>
        <div class="plate" style="border-top-color:#FF453A">
          <div class="row"><span class="old">kick_hard_03</span><span class="to">→</span><span class="new">Kick</span><span class="slot" style="border-color:#FF453A">2</span></div>
          <div class="row"><span class="old">SNR 12 room</span><span class="to">→</span><span class="new">Snare</span><span class="slot" style="border-color:#FF453A">3</span></div>
          <div class="row"><span class="old">hh loop 140</span><span class="to">→</span><span class="new">Hi-hat</span><span class="slot" style="border-color:#FF453A">4</span></div>
        </div>
      </div>
      <div>
        <div class="fhead"><span class="dot" style="background:#FF9F0A"></span>808<small>Mixer 6</small></div>
        <div class="plate" style="border-top-color:#FF9F0A">
          <div class="row"><span class="old">Sub long</span><span class="to">→</span><span class="new">808</span><span class="slot" style="border-color:#FF9F0A">6</span></div>
        </div>
        <div class="fhead" style="margin-top:7px"><span class="dot" style="background:#BF5AF2"></span><span data-t="melodies"></span><small>Mixer 8</small></div>
        <div class="plate" style="border-top-color:#BF5AF2">
          <div class="row"><span class="old">Serum 4</span><span class="to">→</span><span class="new">Lead</span><span class="slot pulse" style="border-color:#BF5AF2">8</span></div>
        </div>
      </div>
    </div>
    <div class="foot"><span class="grey" data-t="annuler"></span><span class="blue" data-t="organiserBouton"></span></div>
    <svg class="cursor" style="right:14px;top:94px" viewBox="0 0 24 24"><path d="M5 3l14 9-6.5 1.4L16 21l-3 1.4-3.5-7.7L5 19z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  </div>

  <div data-step="4">
    <div class="files">
      <div class="plate file"><div class="doc"></div><b data-t="original"></b><small data-t="bougePas"></small></div>
      <span class="arrow2">→</span>
      <div class="plate file"><div class="doc copy"></div><b data-t="copie"></b><small data-t="rangee"></small></div>
    </div>
    <div class="plate ask"><span data-t="question"></span><span class="grey" data-t="arriere"></span><span class="blue pulse" data-t="valider"></span></div>
  </div>

</div>
<script>
const T = {
  fr: { date: 'mer. 29 oct.  10:42', projet: 'Mon son.flp', raccourcis: 'Modifier les raccourcis…', macros: 'Macros…',
        organiser: 'Organiser…', organiserLabel: 'Organiser', ecoute: 'Analyse du projet : 4 sur 8', mains: 'Ne touche pas à FL.',
        melodies: 'Mélodies', annuler: 'Annuler', organiserBouton: 'Organiser', original: 'Mon son.flp',
        bougePas: 'à la Corbeille si tu valides', copie: 'Mon son_2.flp', rangee: 'la version organisée',
        question: 'Tu valides la version organisée ?', arriere: 'Retourner en arrière', valider: 'Oui, valider' },
  en: { date: 'Wed Oct 29  10:42', projet: 'My song.flp', raccourcis: 'Edit shortcuts…', macros: 'Macros…',
        organiser: 'Organize…', organiserLabel: 'Organize', ecoute: 'Analyzing the project: 4 of 8', mains: "Don't touch FL.",
        melodies: 'Melodies', annuler: 'Cancel', organiserBouton: 'Organize', original: 'My song.flp',
        bougePas: 'to the Trash if you keep the new one', copie: 'My song_2.flp', rangee: 'the organized version',
        question: 'Keep the organized version?', arriere: 'Go back', valider: 'Yes, keep it' },
};
const [lang, step] = (location.hash.slice(1) || 'fr-1').split('-');
document.documentElement.lang = lang;
document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T[lang][e.dataset.t]; });
document.querySelector(`[data-step="${step}"]`).style.display = 'block';
</script>
</body>
</html>
