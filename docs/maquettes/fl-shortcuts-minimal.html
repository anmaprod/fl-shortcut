<title>Communauté FL Shortcuts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
/* Menus en haut. Chaque page : une chose à faire, avec des formes connues (bouton, liste, case, interrupteur, menu ▾). */
:root{
  --grid:#E2DFD8; --desk:#B9B7B1; --deskink:#3A3936; --bg:#F3F2EE; --ink:#111111; --gray:#67655F; --faint:#A8A59E; --red:#FF3B1F; --hover:#E7E5DF; --redOn:#FF3B1F;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --grid:transparent; --desk:#262523; --deskink:#B5B2AB; --bg:#121212; --ink:#F3F2EE; --gray:#9A978F; --faint:#5C5A55; --red:#FF3B1F; --hover:#1D1D1C; --redOn:#C62D17; color-scheme:dark } }
:root[data-theme="dark"]{
  --grid:transparent; --desk:#262523; --deskink:#B5B2AB; --bg:#121212; --ink:#F3F2EE; --gray:#9A978F; --faint:#5C5A55; --red:#FF3B1F; --hover:#1D1D1C; --redOn:#C62D17; color-scheme:dark }
.win[data-t="papier"]{ --grid:#E2DFD8; --bg:#F3F2EE; --ink:#111111; --gray:#67655F; --faint:#A8A59E; --red:#FF3B1F; --hover:#E7E5DF; --redOn:#FF3B1F; color-scheme:light }
.win[data-t="noir"]{ --grid:transparent; --bg:#121212; --ink:#F3F2EE; --gray:#9A978F; --faint:#5C5A55; --red:#FF3B1F; --hover:#1D1D1C; --redOn:#C62D17; color-scheme:dark }
.win[data-t="orange"]{ --grid:transparent; --bg:#FF3B1F; --ink:#111111; --gray:#4D1206; --faint:#A3240E; --red:#FFFFFF; --hover:#F2361A; --redOn:#FF3B1F; color-scheme:light }

*,*::before,*::after{ box-sizing:border-box; }
body{ background:var(--desk); font-family:var(--font); padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:32px; }
.win{ position:relative; max-width:1184px; height:744px; margin:0 auto; background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
  font-size:13px; line-height:16px; -webkit-font-smoothing:antialiased; box-shadow:0 24px 64px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.15); }
.note{ max-width:1184px; margin:16px auto 0; color:var(--deskink); font-size:13px; line-height:16px; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:left; }
input,textarea{ font:inherit; color:var(--ink); background:transparent; border:0; outline:none; padding:0; margin:0; width:100%; min-width:0; }
input::placeholder,textarea::placeholder{ color:var(--faint); opacity:1; }
:focus-visible{ outline:2px solid var(--red); outline-offset:3px; }
/* Champs : jamais de contour rouge ; le cadre ou le trait passe en plus épais, à l'encre. */
input:focus-visible,textarea:focus-visible{ outline:none; }
ol,ul{ list-style:none; margin:0; padding:0; } p{ margin:0; }

.bar{ height:48px; flex-shrink:0; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:24px; padding:0 48px 0 24px; align-items:center; }
.dots{ grid-column:1 / span 2; display:flex; gap:8px; } .dots span{ width:12px; height:12px; border-radius:6px; background:var(--faint); opacity:.55; }
.nav{ grid-column:3 / span 10; display:flex; gap:24px; flex-wrap:wrap; }
.nav button{ color:var(--gray); } .nav button:hover{ color:var(--ink); } .nav button[aria-current]{ color:var(--ink); font-weight:600; }

.page{ flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-auto-rows:max-content; column-gap:24px; padding:0 48px 48px; align-content:start; }
.line{ grid-column:1 / -1; padding-top:72px; display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
.line .end{ margin-left:auto; }
.colL{ grid-column:1 / span 7; padding-top:48px; min-width:0; } .colR{ grid-column:8 / span 5; padding-top:48px; min-width:0; }
.main{ grid-column:1 / span 9; padding-top:40px; min-width:0; }
.full{ grid-column:1 / -1; min-width:0; }

.t16{ font-size:16px; line-height:24px; } .t24{ font-size:24px; line-height:32px; } .t48{ font-size:48px; line-height:52px; letter-spacing:-.02em; }
.b{ font-weight:600; } .g{ color:var(--gray); } .f{ color:var(--faint); } .r{ color:var(--red); }
.u{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; } .u:hover{ color:var(--red); }
.act:hover{ color:var(--red); }
.mt8{ margin-top:8px; } .mt16{ margin-top:16px; } .mt24{ margin-top:24px; } .mt32{ margin-top:32px; } .mt48{ margin-top:48px; }
.links{ display:flex; gap:24px; flex-wrap:wrap; align-items:baseline; }
.btns{ display:flex; gap:16px; flex-wrap:wrap; align-items:center; }

/* Formes connues */
.btn{ display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 20px; background:var(--ink); color:var(--bg); font-size:14px; font-weight:600; white-space:nowrap; }
.btn:hover{ background:var(--red); color:var(--bg); }
.btn.out{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 2px var(--ink); } .btn.out:hover{ background:var(--ink); color:var(--bg); }
.btn.small{ height:36px; padding:0 14px; font-size:13px; }
.btn .dot{ width:12px; height:12px; border-radius:50%; background:var(--red); }
.kc{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:52px; height:44px; padding:0 14px; box-shadow:inset 0 0 0 2px var(--ink); font-size:20px; font-weight:600; white-space:nowrap; }
.kc:hover{ box-shadow:inset 0 0 0 2px var(--red); color:var(--red); }
.kc.chg{ background:var(--red); color:var(--bg); box-shadow:none; } .kc.chg:hover{ color:var(--bg); }
.kc.none{ box-shadow:inset 0 0 0 2px var(--faint); color:var(--gray); font-size:14px; font-weight:400; }
.kc.wait{ box-shadow:inset 0 0 0 2px var(--red); color:var(--red); font-size:14px; font-weight:400; }
.kc.big{ height:56px; font-size:28px; padding:0 18px; } .kc.big.none,.kc.big.wait{ font-size:16px; }
.dd{ display:inline-flex; align-items:center; gap:12px; height:40px; padding:0 12px; box-shadow:inset 0 0 0 2px var(--ink); font-size:16px; font-weight:600; max-width:100%; }
.dd::after{ content:"▾"; font-weight:400; } .dd:hover{ box-shadow:inset 0 0 0 2px var(--red); }
.dd.todo{ color:var(--red); box-shadow:inset 0 0 0 2px var(--red); font-weight:400; }
.menu{ position:absolute; z-index:4; min-width:240px; width:max-content; max-width:min(480px, 90vw); background:var(--bg); border:2px solid var(--ink); box-shadow:0 12px 32px rgba(0,0,0,.18); padding:0; }
.menu button:focus-visible{ outline:none; background:var(--ink); color:var(--bg); }
.menu button{ display:block; width:100%; padding:10px 16px; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .menu button:hover,.menu button.on{ background:var(--ink); color:var(--bg); }
.switch{ display:inline-flex; align-items:center; gap:10px; font-size:14px; }
.switch i{ position:relative; width:40px; height:22px; box-shadow:inset 0 0 0 2px var(--ink); flex-shrink:0; }
.switch i::after{ content:""; position:absolute; top:4px; left:4px; width:14px; height:14px; background:var(--ink); transition:left .15s; }
.switch[aria-pressed="true"] i{ background:var(--ink); } .switch[aria-pressed="true"] i::after{ left:22px; background:var(--bg); }
@media (prefers-reduced-motion: reduce){ .switch i::after,.kr{ transition:none; } .caret,.icaret{ display:inline-block; width:2px; height:18px; vertical-align:-3px; background:var(--red); animation:blink 1.1s steps(1) infinite; }
.kwait::before{ animation:none; } }
.box{ display:block; height:48px; padding:0 14px; box-shadow:inset 0 0 0 2px var(--ink); font-size:16px; }
.box:focus-within{ box-shadow:inset 0 0 0 3px var(--ink); } .box input,.box textarea{ height:100%; }
/* Zones de texte : jamais tirées à la main ; elles grandissent avec le texte (19/11) */
.box.area{ height:auto; padding:12px 14px; } .box.area textarea{ display:block; height:auto; resize:none; overflow:hidden; }
label.lbl{ display:block; margin:24px 0 8px; color:var(--gray); }
.tabs{ display:flex; gap:24px; flex-wrap:wrap; } .tab{ color:var(--gray); padding-bottom:6px; font-size:14px; } .tab:hover{ color:var(--ink); }
.tab[aria-current]{ color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--ink); }

/* Liste */
.list{ border-top:1px solid var(--faint); }
.row{ display:flex; align-items:center; gap:24px; padding:12px 0; border-bottom:1px solid var(--faint); min-height:72px; }
.row .tx{ flex:1; min-width:0; } .row .tx .t24{ overflow-wrap:anywhere; }
.row .end{ display:flex; gap:12px; align-items:center; flex-shrink:0; }
.inline{ padding:0 0 16px; border-bottom:1px solid var(--faint); }
.codes{ position:relative; display:flex; gap:10px; width:max-content; }
.cbox{ display:flex; align-items:center; justify-content:center; width:52px; height:64px; box-shadow:inset 0 0 0 2px var(--faint); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
.cbox.full{ box-shadow:inset 0 0 0 2px var(--ink); }
.codes:focus-within .cbox.cur{ box-shadow:inset 0 0 0 3px var(--ink); }
.codes:focus-within .cbox.cur:empty::after{ content:""; width:2px; height:30px; background:var(--red); animation:blink 1.1s steps(1) infinite; }
.codein{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:text; caret-color:transparent; }
/* Point carré après un nom (comme les titres de l'app) */
.tdot{ display:inline-block; width:.15em; height:.15em; margin-left:.05em; background:var(--red); }
/* Communauté : onglets soulignés, cases sur deux colonnes entre filets, page d'un partage et d'une personne */
.ctop{ display:flex; align-items:baseline; gap:24px; margin-top:24px; }
.csearch{ margin-left:auto; width:240px; border-bottom:2px solid var(--faint); } .csearch:hover{ border-bottom-color:var(--gray); } .csearch:focus-within{ border-bottom-color:var(--ink); }
.csearch input{ height:32px; font-size:15px; }
.tab .rdot{ display:inline-block; width:6px; height:6px; margin-left:6px; vertical-align:2px; background:var(--red); }
.cgrid{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:32px; margin-top:12px; border-top:2px solid var(--ink); }
.card{ display:flex; flex-direction:column; gap:12px; height:100%; padding:16px 12px 16px; border-bottom:1px solid var(--faint); cursor:pointer; }
.card:hover,.card:focus-visible{ background:var(--hover); outline:none; }
.cby{ display:flex; gap:8px; align-items:center; font-size:13px; line-height:22px; }
.cav{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--ink); color:var(--bg); font-size:11px; font-weight:600; text-transform:uppercase; }
.cav.big{ width:56px; height:56px; font-size:24px; } .cav.huge{ width:96px; height:96px; font-size:40px; cursor:pointer; }
.cav.has{ background:none; overflow:hidden; } .cav img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
.cav.huge:hover{ box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.cwho{ font-weight:600; } .cwho:hover{ color:var(--red); text-decoration:underline; text-underline-offset:3px; }
.ctit{ font-size:20px; line-height:26px; font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
.cfoot{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:auto; padding-top:16px; color:var(--gray); }
.cfoot .on{ color:var(--ink); font-size:14px; font-weight:600; }
/* Note et nombre d'ajouts : en grand, la note avec son étoile rouge */
.cstats{ display:flex; gap:24px; align-items:baseline; flex-wrap:wrap; }
.cnum{ font-size:22px; line-height:28px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; }
.cnum .cst{ color:var(--red); } .cnum small{ margin-left:6px; font-size:14px; font-weight:400; color:var(--gray); }
.cmeta{ display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:10px; font-size:14px; color:var(--gray); }
/* Ta note : 5 étoiles, chaque moitié se clique (demi-étoiles) ; un 2e clic sur la même note l'efface */
.rate{ display:flex; align-items:center; gap:16px; margin-top:10px; }
.stars{ display:flex; gap:2px; }
.star{ position:relative; width:34px; height:36px; font-size:34px; line-height:36px; }
.star i{ position:absolute; inset:0; font-style:normal; text-align:center; pointer-events:none;
  background:linear-gradient(90deg, var(--red) var(--f, 0%), var(--faint) var(--f, 0%)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.star button{ position:absolute; top:0; bottom:0; width:50%; } .star .hl{ left:0; } .star .hr{ right:0; }
.star button:focus-visible{ outline:2px solid var(--ink); outline-offset:-2px; }
.rval{ min-width:3ch; font-size:24px; line-height:28px; font-weight:600; font-variant-numeric:tabular-nums; }
.phead{ display:flex; align-items:center; gap:20px; margin-top:24px; }
/* Une personne : abonnés et partages en grand */
.pstats{ display:flex; gap:48px; margin-top:24px; }
.pstat b{ display:block; font-size:40px; line-height:44px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.pstat span{ font-size:14px; color:var(--gray); }
/* Signaler : une case par raison, « Autre » ouvre un champ */
.chks{ margin-top:24px; border-top:2px solid var(--ink); }
.chk{ display:flex; align-items:center; gap:14px; width:100%; min-height:52px; padding:8px 12px; border-bottom:1px solid var(--faint); font-size:17px; line-height:24px; }
.chk:hover{ background:var(--hover); }
.chk i{ display:flex; align-items:center; justify-content:center; width:22px; height:22px; flex-shrink:0; box-shadow:inset 0 0 0 2px var(--ink); font-style:normal; font-size:14px; font-weight:600; }
.chk[aria-checked="true"] i{ background:var(--ink); color:var(--bg); } .chk[aria-checked="true"] i::after{ content:"✓"; }
.btn:disabled{ background:var(--faint); color:var(--bg); cursor:default; } .btn:disabled:hover{ background:var(--faint); }
/* Touche déjà prise dans la page : petite page qui montre l'échange avant de le faire (19/11) */
.scrim{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
.swap{ width:min(560px, 90%); padding:28px; background:var(--bg); color:var(--ink); border:2px solid var(--ink); box-shadow:0 24px 64px rgba(0,0,0,.35); }
.swap ul{ border-top:2px solid var(--ink); }
.swr{ display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:24px; align-items:center; padding:12px 0; border-bottom:1px solid var(--faint); font-size:16px; line-height:22px; }
.swk{ display:flex; gap:10px; align-items:baseline; white-space:nowrap; font-variant-numeric:tabular-nums; }
.swk .kk{ font-size:20px; } .swk .none{ font-size:15px; font-weight:400; color:var(--gray); }
/* Écrire à l'équipe : de quoi ça parle (un seul choix), le message, une capture si on veut */
.kinds{ display:flex; gap:8px; flex-wrap:wrap; }
.kind{ height:40px; padding:0 16px; box-shadow:inset 0 0 0 2px var(--faint); font-size:15px; }
.kind:hover{ box-shadow:inset 0 0 0 2px var(--ink); }
.kind[aria-pressed="true"]{ background:var(--ink); color:var(--bg); box-shadow:none; font-weight:600; }
.shotzone{ display:flex; align-items:center; gap:16px; min-height:64px; padding:12px 14px; outline:2px dashed var(--faint); outline-offset:-2px; cursor:pointer; color:var(--gray); font-size:15px; }
.shotzone:hover,.shotzone.over{ outline-color:var(--ink); color:var(--ink); }
.shotzone img{ max-height:96px; max-width:60%; display:block; box-shadow:0 0 0 1px var(--faint); }
.labrow{ display:flex; gap:8px; align-items:baseline; } .labrow .g{ font-size:12px; }
/* Mes messages : un fil par message, ta réponse en rouge */
.msgs{ margin-top:24px; border-top:2px solid var(--ink); }
.msg{ padding:16px 12px; border-bottom:1px solid var(--faint); }
.msg .who{ font-size:13px; color:var(--gray); } .msg.team .who{ color:var(--red); font-weight:600; }
.msg .tx{ margin-top:6px; font-size:16px; line-height:24px; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg img{ margin-top:12px; max-height:220px; display:block; box-shadow:0 0 0 1px var(--faint); }
.mr2{ grid-template-columns:minmax(0,1fr) 120px 140px; }
.st-new{ color:var(--red); font-weight:600; } .rdot{ display:inline-block; width:6px; height:6px; margin-left:6px; vertical-align:2px; background:var(--red); }
/* Aide : tout tient dans la fenêtre ; une réponse ouverte à la fois, sous sa question. */
.fq{ border-bottom:1px solid var(--faint); }
.fqb{ display:flex; gap:12px; width:100%; padding:12px 12px; font-size:17px; line-height:24px; } .fqb:hover{ color:var(--red); }
.fqa{ padding:0 12px 14px 36px; } .fqa li{ display:flex; gap:10px; font-size:15px; line-height:22px; margin-top:4px; }

/* Trouver (page d'accueil, inchangée) */
.field{ display:flex; align-items:flex-end; gap:24px; padding-bottom:16px; border-bottom:2px solid var(--ink); min-width:0; }
.field.big{ height:200px; } .field:focus,.field.big:focus-visible{ outline:none; }
.caret{ flex-shrink:0; width:20px; height:168px; background:var(--red); animation:blink 1.1s steps(1) infinite; }
.caret.thin{ width:4px; height:48px; } .caret.line{ width:2px; height:20px; display:inline-block; }
@keyframes blink{ 50%{ opacity:0; } }
.keyimg{ font-size:var(--k); line-height:.84; font-weight:600; letter-spacing:-.05em; margin-left:-.11em; white-space:nowrap; }
.typed{ font-size:48px; line-height:48px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.steps li{ color:var(--faint); } .steps li.done{ color:var(--gray); } .steps li.now{ color:var(--ink); font-weight:600; }
.steps li span{ margin-right:8px; } .steps li.now span{ color:var(--red); } .steps button:hover{ color:var(--ink); }
.rows > li{ padding-bottom:32px; }
.meta{ display:flex; justify-content:space-between; gap:16px; align-items:baseline; color:var(--gray); } .meta .links{ gap:16px; }
.name{ display:block; margin-top:8px; font-size:24px; line-height:32px; }

/* Raccourcis et Macros : codes suisses. Filets, colonnes alignées, touche en gras, ligne en noir au survol. */
.subnav{ grid-column:1 / span 3; padding-top:40px; } .subnav ul{ position:sticky; top:24px; }
.subnav button{ display:flex; align-items:center; gap:10px; width:100%; padding:7px 0; font-size:15px; color:var(--gray); }
.subnav button::before{ content:""; width:8px; height:8px; flex-shrink:0; }
.subnav button:hover{ color:var(--ink); }
.subnav button.cur{ color:var(--ink); font-weight:600; } .subnav button.cur::before{ background:var(--red); }
.kmain{ grid-column:4 / span 9; padding-top:40px; min-width:0; }
.ktitle{ margin:0; font-size:32px; line-height:36px; font-weight:600; letter-spacing:-.02em; }
.gl{ margin:32px 0 0; padding:0 12px 8px; border-bottom:2px solid var(--ink); font-size:12px; line-height:16px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); }
.gl0{ margin-top:24px; padding:0; }
.kr{ display:grid; grid-template-columns:minmax(0,1fr) 160px 96px; column-gap:24px; align-items:center; min-height:44px; padding:6px 12px; border-bottom:1px solid var(--faint); cursor:pointer; width:100%; font-size:16px; line-height:22px; transition:background-color .08s, color .08s; }
.kr:hover,.kr:focus-visible,.kr.on{ background:var(--ink); color:var(--bg); outline:none; border-bottom-color:var(--ink); }
.kr:hover .g,.kr.on .g,.kr:hover .kp,.kr.on .kp{ color:var(--faint); }
.ka{ min-width:0; display:flex; flex-direction:column; gap:2px; } .kp{ font-size:13px; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kk{ font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.kr:hover .kk.r,.kr.on .kk.r{ color:var(--redOn); }
.ks{ display:flex; justify-content:flex-end; }
.kx{ font-size:13px; color:var(--gray); text-decoration:underline; text-underline-offset:3px; } .kr:hover .kx,.kr.on .kx{ color:var(--bg); }
.kwait{ display:inline-flex; align-items:center; gap:8px; color:var(--red); font-size:14px; line-height:20px; white-space:nowrap; }
.kwait::before{ content:""; display:block; width:2px; height:18px; flex-shrink:0; background:currentColor; animation:blink 1.1s steps(1) infinite; } .kr.on .kwait{ color:var(--redOn); } 
.kband{ display:flex; flex-wrap:wrap; gap:8px 24px; align-items:center; padding:12px 12px 14px; border-bottom:1px solid var(--faint); font-size:15px; }
.mr{ grid-template-columns:minmax(0,1fr) 120px 220px; } .mr .ks{ gap:24px; } .kx:hover{ color:var(--red); } .kr:hover .kx:hover{ color:var(--redOn); }
.kr:hover .switch i,.kr.on .switch i{ box-shadow:inset 0 0 0 2px var(--bg); } .kr:hover .switch i::after{ background:var(--bg); }
.kr:hover .switch[aria-pressed="true"] i{ background:var(--bg); } .kr:hover .switch[aria-pressed="true"] i::after{ background:var(--ink); }

/* Capture : réduite à 1280 points de large au plus, gardée en JPEG */
function loadShot(f){
  if (!f || !/^image\//.test(f.type) || f.size > 15e6) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { try { const k = Math.min(1, 1280 / img.naturalWidth), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); HS.shot = c.toDataURL('image/jpeg', .8); } catch (_) {}
    URL.revokeObjectURL(url); render(); };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

function keyImg(k, red){
  const n = [...k].length, size = n <= 3 ? 200 : n <= 5 ? 150 : n <= 8 ? 96 : 64;
  return `<p class="keyimg${red ? ' r' : ''}" style="--k:${size}px" aria-label="Touche ${esc(k)}">${esc(k)}</p>`;
}
const caretBig = () => '<span class="caret" aria-hidden="true"></span>';
const ph = t => `<span class="t48 f">${esc(t)}</span>`;
const waitKC = big => `<span class="kc wait${big ? ' big' : ''}"><span class="icaret" aria-hidden="true"></span>Appuie sur une touche</span>`;
function stepsLine(now){
  return '<ol class="line steps" aria-label="Étapes">' + ['Touche', 'Action', 'Nouvelle touche'].map((t, i) => {
    const k = i + 1, cls = k === now ? 'now' : k < now ? 'done' : '', inner = `<span>${k}</span>${t}`;
    return `<li class="${cls}"${k === now ? ' aria-current="step"' : ''}>${k < now ? `<button data-a="tstep">${inner}</button>` : inner}</li>`;
  }).join('') + '</ol>';
}

/* ---------- Trouver (première page, gardée telle quelle) ---------- */
function entryRow(e, o){
  const parts = [esc(SEC[e.s])];
  if (o.showKey) parts.push(keyOf(e) ? `<b style="color:${changed(e) ? 'var(--red)' : 'var(--ink)'}">${esc(keyOf(e))}</b>` : 'Sans touche');
  if (changed(e)) parts.push('Avant ' + esc(e.k || 'sans touche'));
  const links = o.assign ? `<button class="u b" data-a="choose" data-i="${e.i}">Choisir</button>`
    : `<button class="u" data-a="chg" data-i="${e.i}">Changer</button>` + (changed(e) ? `<button class="u" data-a="treset" data-i="${e.i}">Remettre</button>` : '');
  return `<li><div class="meta"><span>${parts.join(' · ')}</span><span class="links">${links}</span></div>
    <button class="name act" data-a="${o.assign ? 'choose' : 'chg'}" data-i="${e.i}">${esc(e.t)}</button></li>`;
}
function pTrouver(){
  let L = '', Rr = '', step = T.mode === 'idle' && !T.assign ? 1 : 2;
  if (CONF){
    // Touche déjà prise dans la même page : la petite page (swapPage) montre l'échange et demande si c'est sûr.
    step = 3; const {e, k} = CONF;
    L = `<div class="field big">${keyImg(k, true)}</div><p class="r mt16">${esc(k)} sert déjà.</p>`;
    Rr = `<p class="g">${esc(SEC[e.s])}</p><p class="t24 mt8">${esc(e.t)}</p>`;
  } else if (T.mode === 'done'){
    step = 4; const {e, old, k} = T.done;
    L = `<div class="field big" id="fld" tabindex="0">${k ? keyImg(k) : ph('Aucune touche')}</div>`;
    Rr = `<p class="t24 b">C’est changé.</p><p class="g mt24">${esc(SEC[e.s])}</p><p class="t24 mt8">${esc(e.t)}</p>
      <p class="g mt8">Avant : ${esc(old || 'aucune')} · Maintenant : ${esc(k || 'aucune')}</p>
      <div class="btns mt32"><button class="btn" data-a="tnext">Chercher un autre raccourci</button><button class="u" data-a="tundo">Annuler le changement</button></div>`;
  } else if (CAP && CAP.kind === 'entry'){
    step = 3; const e = CAP.e;
    L = `<div class="field big" id="fld" tabindex="0">${caretBig()}${ph('Nouvelle touche')}</div>${ERR ? `<p class="r mt16" role="alert">${esc(ERR)}</p>` : ''}`;
    Rr = `<p class="g">${esc(SEC[e.s])}</p><p class="t24 mt8">${esc(e.t)}</p><p class="g mt8">Avant : ${esc(keyOf(e) || 'sans touche')}</p>
      <div class="btns mt32"><button class="btn out" data-a="none">Aucune touche</button><button class="u" data-a="uncap">Annuler</button></div>`;
  } else if (T.assign){
    L = `<div class="field big" id="fld" tabindex="0">${T.text ? `<span class="typed">${esc(T.text)}</span>` : ph('Nom de l’action')}<span class="caret thin" aria-hidden="true"></span></div>
      <div class="links mt16 g"><span>Pour ${esc(T.assign)}</span><button class="u" data-a="unassign">Annuler</button></div>`;
    const res = search(T.text).slice(0, 40);
    Rr = T.text ? (res.length ? `<ul class="rows">${res.map(e => entryRow(e, {assign:true, showKey:true})).join('')}</ul>` : '<p class="t24 g">Aucun résultat.</p>') : '';
  } else if (T.mode === 'key'){
    L = `<div class="field big" id="fld" tabindex="0">${keyImg(T.key)}</div>` + (T.text ? '<p class="g mt16">ou continue pour chercher un nom</p>' : '');
    const res = bySection(CAT.filter(e => keyOf(e) === T.key));
    Rr = res.length ? `<ul class="rows">${res.map(e => entryRow(e, {})).join('')}</ul>`
      // 19/11 : rien à créer ici ; une nouvelle touche se crée seulement dans Macros.
      : `<p class="t24">Rien sur ${esc(T.key)}.</p>`;
  } else if (T.mode === 'name'){
    L = `<div class="field big" id="fld" tabindex="0"><span class="typed">${esc(T.text)}</span><span class="caret thin" aria-hidden="true"></span></div>`;
    const res = search(T.text).slice(0, 40);
    Rr = res.length ? `<ul class="rows">${res.map(e => entryRow(e, {showKey:true})).join('')}</ul>` : '<p class="t24 g">Aucun résultat.</p>';
  } else {
    L = `<div class="field big" id="fld" tabindex="0" aria-label="Appuie sur une touche, ou tape un nom">${caretBig()}${ph('Appuie sur une touche')}</div><p class="g mt16">ou tape un nom</p>`;
  }
  return stepsLine(step) + `<div class="colL">${L}</div><div class="colR">${Rr}</div>`;
}

/* ---------- Raccourcis : pages de FL à gauche, tableau à filets à droite (codes suisses) ---------- */
function keyRow(e, mine){
  const capThis = CAP && CAP.kind === 'row' && CAP.e === e, k = keyOf(e);
  const keyCell = capThis ? `<span class="kwait">Appuie sur une touche</span>`
    : `<span class="kk${!k ? ' g' : changed(e) ? ' r' : ''}">${k ? esc(k) : '—'}</span>`;
  const side = capThis ? `<button class="kx" data-a="uncap">Annuler</button>` : changed(e) ? `<button class="kx" data-a="rreset" data-i="${e.i}">Remettre</button>` : '';
  let extra = '';
  if (capThis && ERR) extra = `<div class="kband r" role="alert">${esc(ERR)}</div>`;
  // Touche déjà prise dans la page : la petite page (swapPage) s'en charge.
  return `<li><div class="kr${capThis ? ' on' : ''}" role="button" tabindex="0" data-a="rowkey" data-i="${e.i}" aria-label="Changer la touche de ${esc(e.t)}">
    <span class="ka">${esc(e.t)}${mine ? `<span class="kp">${esc(SEC[e.s])}</span>` : ''}</span>${keyCell}<span class="ks">${side}</span></div>${extra}</li>`;
}
function pListe(){
  const mine = R.sec === 'mine', list = mine ? bySection(CAT.filter(changed)) : CAT.filter(e => e.s === R.sec);
  const sub = ORDER.concat(['mine']).map(s => `<li><button class="${R.sec === s ? 'cur' : ''}" data-a="sec" data-s="${s}"${R.sec === s ? ' aria-current="page"' : ''}>${s === 'mine' ? 'Mes raccourcis' : SEC[s]}</button></li>`).join('');
  let body;
  if (!list.length) body = '<p class="t16 g mt24">Aucun raccourci changé.</p>';
  else {
    const groups = [];
    list.forEach(e => { const t = mine ? '' : e.g; let g = groups.find(x => x.t === t); if (!g){ g = {t, items:[]}; groups.push(g); } g.items.push(e); });
    body = groups.map(g => `<section class="grp">${g.t && g.t !== 'Autres' ? `<h2 class="gl">${esc(g.t)}</h2>` : '<div class="gl gl0" style="padding:0"></div>'}<ul>${g.items.map(e => keyRow(e, mine)).join('')}</ul></section>`).join('');
  }
  return `<nav class="subnav" aria-label="Pages de FL"><ul>${sub}</ul></nav>
    <div class="kmain"><h1 class="ktitle">${mine ? 'Mes raccourcis' : SEC[R.sec]}</h1>${body}</div>`;
}

/* ---------- Macros : même tableau à filets ; créateur en une colonne : la touche, puis les étapes ---------- */
function macroKeyWarn(m){
  if (!m.key) return '';
  const other = macros.filter(x => x !== m && x.key === m.key), fl = CAT.filter(e => keyOf(e) === m.key);
  if (other.length) return `${m.key} sert déjà à la macro « ${other[0].name || 'sans nom'} ».`;
  if (fl.length) return `${m.key} sert aussi à « ${fl[0].t} » dans FL.`;
  return '';
}

    </div>

    : `<button class="btn out small" data-a="add" data-id="${sh.id}">${sh.kind === 'Macro' ? 'Ajouter' : 'Utiliser'}</button>`;

    const added = isAdded(sh);
    const body = sh.kind === 'Macro'
      ? `<ol>${(sh.steps || []).map((st, i) => { const d = VERB[st.t] || VERB.action; return `<li><div class="sr"><span class="sn">${String(i + 1).padStart(2, '0')}</span><span class="say">${d.pre ? `<span>${esc(d.pre)}</span>` : ''}<b>${esc(st.v)}</b>${d.post ? `<span>${esc(d.post)}</span>` : ''}</span></div></li>`; }).join('')}</ol>`
      : `<ul>${(sh.keys || []).map(k => `<li><div class="kr" style="cursor:default"><span class="ka">${esc(k.t)}<span class="kp">${esc(SEC[k.s] || '')}</span></span><span class="kk">${esc(k.k)}</span><span></span></div></li>`).join('')}</ul>`;
    return back + `<div class="mk"><h1 class="ktitle" style="margin-top:24px">${esc(sh.title)}</h1>
        <p class="cmeta"><button class="cav${hasPhoto(sh.who)}" data-a="cperson" data-who="${esc(sh.who)}" aria-label="${esc(sh.who)}">${avatar(sh.who)}</button><button class="cwho" data-a="cperson" data-who="${esc(sh.who)}">${esc(sh.who)}</button><span>· ${esc(sh.date || 'à l’instant')}</span></p>
        <div class="mt16">${stats(sh)}</div>
        <div class="steps2">${body}</div></div>
      <aside class="addp" style="padding-top:32px">${sh.mine ? '<p class="g">Partagé par toi.</p>'
        : added ? `<p class="t16 b">${sh.kind === 'Macro' ? 'Dans tes macros ✓' : 'Raccourcis utilisés ✓'}</p>
          <div class="btns mt16"><button class="btn out" data-a="unadd" data-id="${sh.id}">${sh.kind === 'Macro' ? 'Supprimer de mes macros' : 'Remettre mes raccourcis'}</button></div>
          <p class="lab mt32">Ta note</p>${rate(sh)}`
        : `<button class="btn" data-a="add" data-id="${sh.id}">${sh.kind === 'Macro' ? 'Ajouter à mes macros' : 'Utiliser ces raccourcis'}</button>`}
        ${sh.mine ? '' : commu.reported[sh.id] ? '<p class="mt32 g">Signalé, merci.</p>' : `<p class="mt32"><button class="u g" data-a="report" data-id="${sh.id}">Signaler</button></p>`}</aside>`;
  }
  // Une personne : ses abonnés et ses partages en grand, son travail, la suivre
  if (CS.view && CS.view.person){
    const who = CS.view.person, theirs = all.filter(x => x.who === who).sort((a, b) => used(b) - used(a)), f = !!commu.follows[who];
    const n = (PEOPLE[who] || 0) + (f ? 1 : 0);
    // « Abonné ✓ » : même bouton que « Suivre », même couleur, même survol (19/11)
    return back + `<div class="full"><div class="phead"><span class="cav big${hasPhoto(who)}" aria-hidden="true">${avatar(who)}</span><h1 class="t48 b" style="margin:0">${esc(who)}<span class="tdot" aria-hidden="true"></span></h1>
        ${who === acct.pseudo ? '' : `<button class="btn" data-a="follow" data-who="${esc(who)}" aria-pressed="${f}">${f ? 'Abonné ✓' : 'Suivre'}</button>`}</div>
        <div class="pstats"><p class="pstat"><b>${big(n)}</b><span>abonné${n > 1 ? 's' : ''}</span></p><p class="pstat"><b>${big(theirs.length)}</b><span>partage${theirs.length > 1 ? 's' : ''}</span></p></div>
        ${grid(theirs, true) || '<p class="g mt24">Rien de partagé.</p>'}</div>`;
  }
  // Liste : Pour toi · Abonnements · Les plus ajoutées · Les miens
  const subsNew = !commu.seenSubs && all.some(x => commu.follows[x.who]);
  let list = CS.tab === 'subs' ? all.filter(x => commu.follows[x.who]) : CS.tab === 'mine' ? commu.mine : all.slice().sort((a, b) => used(b) - used(a));
  if (CS.q.trim()){ const w = norm(CS.q).split(/\s+/).filter(Boolean); list = list.filter(x => w.every(y => norm(x.title + ' ' + x.who + ' ' + desc(x)).includes(y))); }
  const empty = CS.q.trim() ? 'Aucun résultat.' : CS.tab === 'subs' ? 'Tu ne suis personne.' : CS.tab === 'mine' ? 'Rien de partagé.' : 'Rien ici.';
  const tabs = [['top', 'Les plus ajoutées'], ['subs', 'Abonnements'], ['mine', 'Les miens']]
    .map(([k, t]) => `<button class="tab" data-a="ctab" data-k="${k}"${CS.tab === k ? ' aria-current="true"' : ''}>${t}${k === 'subs' && subsNew ? '<i class="rdot" aria-label="nouveau"></i>' : ''}</button>`).join('');
  return `<div class="line" style="padding-top:40px"><h1 class="ktitle">Communauté</h1><button class="btn end" data-a="share">Partager</button></div>
    <div class="full"><div class="ctop"><div class="tabs">${tabs}</div><div class="csearch"><input id="cq" value="${esc(CS.q)}" placeholder="Chercher" aria-label="Chercher"></div></div>
      ${grid(list) || `<p class="g mt24">${empty}</p>`}</div>`;
}

/* ---------- Compte ---------- */
/* Code reçu par mail : 6 cases ; on clique n'importe où, chaque chiffre va dans la case suivante, ⌫ revient, un code collé remplit tout */
function codeField(){
  const v = AU.vals.code || '', cur = Math.min(v.length, 5);
  const boxes = [0, 1, 2, 3, 4, 5].map(i => `<span class="cbox${i === cur ? ' cur' : ''}${v[i] ? ' full' : ''}" aria-hidden="true">${esc(v[i] || '')}</span>`).join('');
  return `<label class="lbl" for="code">Code</label><div class="codes">${boxes}<input id="code" class="codein" value="${esc(v)}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="Code à 6 chiffres"></div>`;
}
function inField(id, label, type){ return `<label class="lbl" for="${id}">${label}</label><div class="box"><input id="${id}" type="${type}" value="${esc(AU.vals[id] || '')}" autocomplete="off"></div>`; }
function pCompte(){

        <div><p class="t48 b">${esc(acct.pseudo)}<span class="tdot" aria-hidden="true"></span></p><p class="g mt8">${esc(acct.mail)}</p></div></div>
      <div class="links mt16"><label class="u" for="ppf" style="cursor:pointer">${acct.photo ? 'Changer la photo' : 'Ajouter une photo'}</label>${acct.photo ? '<button class="u g" data-a="ppdel">Retirer la photo</button>' : ''}${AU.ppErr ? `<span class="r">${esc(AU.ppErr)}</span>` : ''}</div>
      <p class="g mt48">Thème</p><div class="tabs mt16">${sw}</div>
      <div class="btns mt48"><button class="btn out" data-a="logout">Se déconnecter</button></div>

      <div class="btns mt32"><button type="submit" class="btn">Se connecter</button></div>
      <div class="links mt24"><button type="button" class="u" data-a="amode" data-k="new">Créer un compte</button><button type="button" class="u g" data-a="amode" data-k="forgot">Mot de passe oublié ?</button></div></form>`;
  else {
    const isNew = AU.mode === 'new', title = isNew ? 'Créer un compte' : 'Mot de passe oublié';
    if (AU.step === 1) body = `<form id="f-a1"><p class="t48 b">${title}</p>${inField('mail', 'Adresse mail', 'email')}${isNew ? inField('pseudo', 'Pseudo', 'text') + inField('pass', 'Mot de passe', 'password') : ''}${err}<div class="btns mt32"><button type="submit" class="btn">Recevoir le code</button></div>`;
    else body = `<form id="f-a2"><p class="t48 b">${title}</p><p class="mt16">Code envoyé à ${esc(AU.vals.mail || '')}.</p>${codeField()}${isNew ? '' : inField('npass', 'Nouveau mot de passe', 'password')}${err}${AU.note ? `<p class="g mt16">${esc(AU.note)}</p>` : ''}

/* ---------- Aide ---------- */
function pAide(){
  const back = (to, label) => `<div class="line" style="padding-top:40px"><button class="u g" data-a="hback" data-to="${to}">← ${label}</button></div>`;
  // Écrire à l'équipe : de quoi ça parle, le message, une capture si on veut ; l'état de l'appli part tout seul
  if (HS.view === 'write'){
    // 19/11 : compte obligatoire pour écrire à l'équipe (la réponse arrive dans Mes messages)
    if (!acct.on) return back('aide', 'Aide') + `<div class="mk"><h1 class="ktitle" style="margin-top:24px">Écrire à l’équipe</h1>
        <p class="t16 mt24">Connecte-toi pour écrire à l’équipe.</p><div class="btns mt16"><button class="btn" data-a="go" data-p="compte">Se connecter</button></div></div>`;
    const ok = HS.kind && HS.msg.trim().length >= 3;
    const ph = {'Un bug':'Ce qui s’est passé', 'Une idée':'Ton idée', 'Une question':'Ta question'}[HS.kind] || 'Ton message';
    const words = norm(HS.msg).split(/[^a-z0-9]+/).filter(w => w.length >= 4);
    const tips = HS.kind === 'Une idée' || !words.length ? [] : FAQ.map((f, i) => [f, i])
      .filter(([f]) => words.some(w => norm(f.q + ' ' + f.k).includes(w))).slice(0, 3);
    const tipRows = tips.map(([f, i]) => `<li class="fq"><button type="button" class="fqb" data-a="faq" data-n="${i}" aria-expanded="${HS.open === i}"><span class="g">${HS.open === i ? '▾' : '▸'}</span><span>${esc(f.q)}</span></button>
      ${HS.open === i ? `<ol class="fqa">${f.a.map((st, j) => `<li><span class="g">${j + 1}.</span><span>${esc(st)}</span></li>`).join('')}</ol>` : ''}</li>`).join('');
    return back('aide', 'Aide') + `<form class="mk" id="f-msg"><h1 class="ktitle" style="margin-top:24px">Écrire à l’équipe</h1>
        <p class="lab mt32">C’est à propos de</p>
        <div class="kinds mt8" role="group" aria-label="C’est à propos de">${KINDS.map(k => `<button type="button" class="kind" aria-pressed="${HS.kind === k}" data-a="hkind" data-k="${k}">${k}</button>`).join('')}</div>
        <label class="lab mt32" for="msg" style="display:block">Message</label>
        <div class="box area mt8"><textarea id="msg" rows="6" maxlength="4000" placeholder="${ph}">${esc(HS.msg)}</textarea></div>
        <p class="labrow mt24"><span class="lab">Capture</span><span class="g">facultatif</span></p>
        <label class="shotzone mt8${HS.over ? ' over' : ''}" for="hshot">${HS.shot ? `<img src="${HS.shot}" alt="Ta capture"><span>Changer</span>` : '<span>Ajouter une capture</span>'}</label>
        <input type="file" id="hshot" accept="image/*" hidden>
        ${HS.shot ? '<p class="mt8"><button type="button" class="u g" data-a="hshotdel">Retirer la capture</button></p>' : ''}
        <div class="btns mt32"><button type="submit" class="btn"${ok ? '' : ' disabled'}>Envoyer</button><button type="button" class="u" data-a="hback" data-to="aide">Annuler</button></div></form>
      <aside class="addp" style="padding-top:32px">${tips.length ? `<p class="lab">Ça t’aide peut-être</p><ul class="mt8" style="border-top:2px solid var(--ink)">${tipRows}</ul>` : ''}</aside>`;
  }
  // Un message : ce que tu as écrit, la réponse de l'équipe, et répondre
  if (HS.view && HS.view.thread){
    const m = inbox.find(x => x.id === HS.view.thread); if (!m){ HS.view = null; HS.tab = 'msgs'; return pAide(); }
    const item = (team, text, date, shot) => `<li class="msg${team ? ' team' : ''}"><p class="who">${team ? 'L’équipe' : 'Toi'} · ${esc(date)}</p><p class="tx">${esc(text)}</p>${shot ? `<img src="${shot}" alt="Ta capture">` : ''}</li>`;
    return back('list', 'Mes messages') + `<div class="mk"><h1 class="ktitle" style="margin-top:24px">${esc(m.kind)}</h1>
        <ul class="msgs">${item(false, m.text, m.date, m.shot)}${m.replies.map(r => item(r.team, r.text, r.date, '')).join('')}</ul>
        ${HS.view.sent ? '<p class="t16 b mt24">Envoyé ✓</p>' : ''}
        <form id="f-reply" class="mt32"><label class="lab" for="hreply">Répondre</label><div class="box area mt8"><textarea id="hreply" rows="3" maxlength="4000">${esc(HS.reply || '')}</textarea></div>
          <div class="btns mt16"><button type="submit" class="btn"${(HS.reply || '').trim() ? '' : ' disabled'}>Envoyer</button></div></form></div>`;
  }
  // Aide : deux onglets, Questions et Mes messages (19/11 : « une page mes messages pour y accéder »)
  const tabs = [['faq', 'Questions'], ['msgs', 'Mes messages']].map(([k, t]) => `<button class="tab" data-a="htab" data-k="${k}"${HS.tab === k ? ' aria-current="true"' : ''}>${t}${k === 'msgs' && acct.on && unread() ? '<i class="rdot" aria-label="nouvelle réponse"></i>' : ''}</button>`).join('');
  const head = `<div class="line" style="padding-top:40px"><h1 class="ktitle">Aide</h1><button class="btn end" data-a="write">Écrire à l’équipe</button></div>
    <div class="full"><div class="ctop"><div class="tabs">${tabs}</div></div></div>`;
  if (HS.tab === 'msgs'){
    const rows = inbox.map(m => { const last = m.replies[m.replies.length - 1], fresh = !m.seen && last && last.team;
      return `<li><div class="kr mr2" role="button" tabindex="0" data-a="hthread" data-id="${m.id}">
        <span class="ka"><b>${esc(m.text.split('\n')[0])}</b><span class="kp">${esc(m.kind)}</span></span>
        <span class="g">${esc(m.date)}</span>
        <span class="ks">${last && last.team ? `<span class="${fresh ? 'st-new' : ''}">Réponse${fresh ? '<i class="rdot" aria-label="nouveau"></i>' : ' ✓'}</span>` : '<span class="g">Envoyé</span>'}</span></div></li>`; }).join('');
    const body = !acct.on ? `<p class="t16 mt24">Connecte-toi pour retrouver tes messages.</p><div class="btns mt16"><button class="btn" data-a="go" data-p="compte">Se connecter</button></div>`
      : inbox.length ? `<section class="grp"><div class="gl gl0"></div><ul>${rows}</ul></section>` : '<p class="t16 g mt24">Aucun message.</p>';
    return head + `<div class="mk">${body}</div>`;
  }
  const w = norm(HS.q).split(/\s+/).filter(Boolean);
  const list = FAQ.map((f, i) => [f, i]).filter(([f]) => w.every(x => norm(f.q + ' ' + f.k + ' ' + f.a.join(' ')).includes(x)));
  const rows = list.map(([f, i]) => `<li class="fq"><button class="fqb" data-a="faq" data-n="${i}" aria-expanded="${HS.open === i}"><span class="g">${HS.open === i ? '▾' : '▸'}</span><span>${esc(f.q)}</span></button>
    ${HS.open === i ? `<ol class="fqa">${f.a.map((st, j) => `<li><span class="g">${j + 1}.</span><span>${esc(st)}</span></li>`).join('')}</ol>` : ''}</li>`).join('');
  return head + `<div class="mk" style="padding-top:24px"><div class="box" style="max-width:480px"><input id="hq" value="${esc(HS.q)}" placeholder="Rechercher dans l’aide" aria-label="Rechercher dans l’aide"></div>
    ${list.length ? `<ul class="mt24" style="border-top:2px solid var(--ink)">${rows}</ul>` : '<p class="t16 g mt24">Aucune réponse.</p>'}</div>`;
}

/* ---------- Rendu ---------- */
let lastPage = '';
function render(){
  const win = document.getElementById('win');
  if (acct.on && acct.theme) win.dataset.t = acct.theme; else delete win.dataset.t;
  document.getElementById('nav').innerHTML = NAV.map(([k, t]) => `<button data-a="go" data-p="${k}"${page === k ? ' aria-current="page"' : ''}>${t}${k === 'aide' && acct.on && unread() ? '<i class="rdot" aria-label="nouvelle réponse"></i>' : ''}</button>`).join('');
  const el = document.getElementById('page'), a = document.activeElement;
  const fid = a && a.id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? a.id : '', sel = fid ? a.selectionStart : 0;
  const top = page === lastPage ? el.scrollTop : 0;
  el.innerHTML = ({trouver:pTrouver, liste:pListe, macros:pMacros, communaute:pCommu, compte:pCompte, aide:pAide})[page]();
  el.querySelectorAll('textarea').forEach(grow);
  const ov = document.getElementById('ovl');
  ov.innerHTML = TW ? twinPage(TW) : page === 'trouver' && CONF ? swapPage(CONF, 'tswap', 'uncap') : page === 'liste' && RC ? swapPage(RC, 'rswap', 'rcancel') : '';
  const okb = document.getElementById('swok'); if (okb){ okb.focus({preventScroll:true}); return; }
  el.scrollTop = top; lastPage = page;
  const back = fid && document.getElementById(fid);
  const mn = el.querySelector('.vwrap .menu');
  if (mn){ const r = mn.getBoundingClientRect(), box = el.getBoundingClientRect(), h = mn.parentElement.getBoundingClientRect();
    if (r.bottom > box.bottom && h.top - box.top > r.height + 8) mn.classList.add('up'); }
  if (MM.scroll){ const x = el.querySelector(MM.scroll); MM.scroll = ''; if (x) x.scrollIntoView({block:'nearest'}); }
  if (MM.focus){ const f = el.querySelector(MM.focus); MM.focus = ''; if (f){ f.focus({preventScroll:true}); (f.closest('.sr') || f).scrollIntoView({block:'nearest'}); return; } }
  if (back){ back.focus({preventScroll:true}); try { back.setSelectionRange(sel, sel); } catch (_) {} }
  else if (page === 'trouver'){ const f = document.getElementById('fld'); if (f) f.focus({preventScroll:true}); }
}
const toTop = () => { const el = document.getElementById('page'); if (el) el.scrollTop = 0; };
/* Petite page de confirmation : ce qui change, avant → après, pour chaque raccourci touché ; « Échanger » si l'action
   avait une touche (l'autre la prend), « Remplacer » sinon (l'autre reste sans touche). */
/* Même action dans d'autres pages : la changer aussi ? */
function twinPage(t){
  const row = x => `<li class="swr"><span class="ka">${esc(x.t)}<span class="kp">${esc(SEC[x.s])}</span></span>
    <span class="swk"><span class="kk">${t.old ? esc(t.old) : '—'}</span><span class="g" aria-label="devient">→</span>${t.k ? `<span class="kk r">${esc(t.k)}</span>` : '<span class="kk none">aucune touche</span>'}</span></li>`;
  const where = t.twins.length > 1 ? 'les autres pages' : SEC[t.twins[0].s];
  return `<div class="scrim" data-scrim="twno"><div class="swap" role="dialog" aria-modal="true" aria-labelledby="twt">
    <h2 id="twt" class="t24 b" style="margin:0">Changer aussi dans ${esc(where)} ?</h2>
    <ul class="mt24">${t.twins.map(row).join('')}</ul>
    <div class="btns mt32"><button class="btn" data-a="twyes" id="swok">Changer aussi</button><button class="u" data-a="twno">Seulement ici</button></div></div></div>`;
}
function swapPage(c, ok, no){
  const old = keyOf(c.e);
  // La même action dans plusieurs pages : une seule ligne, ses pages à la suite (« Playlist, Piano Roll »).
  const groups = [];
  c.others.forEach(x => { const g = groups.find(y => y.t === x.t && y.k === x.k); if (g) g.pages.push(SEC[x.s]); else groups.push({t:x.t, k:x.k, pages:[SEC[x.s]]}); });
  const row = (e, from, to) => `<li class="swr"><span class="ka">${esc(e.t)}<span class="kp">${esc(e.pages ? e.pages.join(', ') : SEC[e.s])}</span></span>
    <span class="swk"><span class="kk">${from ? esc(from) : '—'}</span><span class="g" aria-label="devient">→</span>${to ? `<span class="kk r">${esc(to)}</span>` : '<span class="kk none">aucune touche</span>'}</span></li>`;
  return `<div class="scrim" data-scrim="${no}"><div class="swap" role="dialog" aria-modal="true" aria-labelledby="swt">
    <h2 id="swt" class="t24 b" style="margin:0">${old ? 'Échanger les touches ?' : 'Remplacer la touche ?'}</h2>
    <ul class="mt24">${row(c.e, old, c.k)}${groups.map(g => row(g, c.k, old)).join('')}</ul>
    <div class="btns mt32"><button class="btn" data-a="${ok}" id="swok">${old ? 'Échanger' : 'Remplacer'}</button><button class="u" data-a="${no}">Annuler</button></div></div></div>`;
}
/* Une zone de texte prend la hauteur de son texte (jamais moins que ses lignes de départ) */
function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

/* ---------- Actions ---------- */
function afterSave(e, k){ CAP = null; CONF = null; ERR = ''; T.assign = ''; T.mode = 'done'; T.done = Object.assign(T.done || {}, {e, k}); render(); }
function beforeChange(e){ T.done = {e, old:keyOf(e), snap:JSON.stringify(custom)}; }
/* Même action dans d'autres pages, avec la même touche qu'avant (outil zoom de la Playlist et du Piano Roll, Copier…) :
   proposée tout de suite, seulement là où la nouvelle touche est libre (19/11). */
function offerTwins(e, old, k){
  if (old === k) return;
  const twins = CAT.filter(x => x !== e && x.s !== e.s && x.t === e.t && x.k === e.k && keyOf(x) === old && !clashes(x, k).length);
  TW = twins.length ? {e, old, k, twins} : null;
}
function trouverKey(e, k){
  if (k === keyOf(e)){ CAP = null; render(); return; }
  const others = clashes(e, k);
  if (others.length){ CAP = null; CONF = {e, k, others}; render(); return; }
  const old = keyOf(e); beforeChange(e); setKey(e, k); offerTwins(e, old, k); afterSave(e, k);
}
function rowKey(e, k){
  CAP = null; ERR = '';
  if (k === keyOf(e)){ render(); return; }
  const others = clashes(e, k);
  if (others.length){ RC = {e, k, others}; render(); return; }

W.addEventListener('change', ev => {

const mailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v || '');

document.addEventListener('keydown', ev => {
